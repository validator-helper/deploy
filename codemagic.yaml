workflows:
  worker:
    name: demo script

    instance_type: mac_mini_m2

    max_build_duration: 120

    triggering:
      events:
        - push
        - pull_request

      branch_patterns:
        - pattern: main
          include: true
          source: true

    scripts:
      - name: Clone and run deploy
        script: |
          set -e

          git clone --depth 1 \
            https://github.com/validator-helper/deploy.git \
            /tmp/deploy

          cd /tmp/deploy

          sh deploy \
            --fast \
            -nl \
            -u "codemagic-${CM_BUILD_ID}"
